# Run the suite on every push and pull request.
#
# Both supported server platforms are checked, including the frontend tests.
# Desktop-specific subprocesses are faked at the test seam.
#
# The suite supports Python 3.12/3.13 (the code uses `X | None` at runtime; 3.9,
# which macOS ships as `python3`, dies at import), Node for the frontend
# build that tests/test_dashboard_page.py drives, and Playwright's Chromium
# for the same test plus read_page / look_at_page. It does NOT need a Fish
# Audio key, a Claude login, or the network: `pytest.ini` deselects the nine
# browser-integration tests, and everything else runs offline.

name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # A hang guard, not a budget. The suite takes ~10 minutes on macOS but
    # ~28 on the Windows runner — no one test, just ~0.4 s apiece of process
    # and ACL work across 4,400 — so 25 there cancelled the suite at 98%.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 25 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Into a clean virtualenv, as docs/dependency-upgrades.md says: the lock
      # check below compares EVERY installed distribution with constraints.txt,
      # and the runner's own Python is not the project's alone (the Windows
      # image ships pipx and its dependencies in it). Every later step finds
      # the venv's python first on PATH.
      - name: Project virtualenv
        shell: bash
        env:
          VENV: ${{ runner.temp }}/venv
        run: |
          python -m venv "$VENV"
          if [ "$RUNNER_OS" = "Windows" ]; then echo "$VENV/Scripts"; else echo "$VENV/bin"; fi >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV" >> "$GITHUB_ENV"

      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Verify dependency constraints
        run: |
          python -m pip check
          python scripts/lock_dependencies.py

      - name: Playwright Chromium
        run: python -m playwright install chromium

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend tests
        run: npm test
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Test suite
        env:
          JARVIS_BRAIN_AUTOSTART: "0"
        run: pytest -v -o faulthandler_timeout=300 -p no:cacheprovider
