[pytest]
# `pytest` on its own must do the right thing: the whole suite, touching
# neither the network nor the screen.
#
# A test that needs a real browser window or the network is marked `browser`
# and deselected here. Run those deliberately with
#
#     pytest -m browser
#
testpaths = tests
addopts = -m "not browser"
markers =
    browser: opens a real browser window and needs the network. Not run by default.
